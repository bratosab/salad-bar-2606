<div class="salad-page">
  <header class="salad-header">
    <div class="header-text">
      <h1>Build Your Salad</h1>
      <p>Hey <strong>{{ name() }}</strong>, pick your toppings!</p>
    </div>
    <div class="price-badge">
      <span class="price-label">Total</span>
      <span class="price-value">{{ toppingsService.totalPrice() }} €</span>
    </div>
  </header>

  <div class="panels">
    <section class="panel available-panel">
      <div class="panel-title">
        <span class="panel-icon">🌿</span>
        Available Toppings
      </div>
      <app-toppings
        [toppings]="toppings()"
        buttonLabel="Add"
        (chooseTopping)="ChooseTopping($event)"
      ></app-toppings>
    </section>

    <section class="panel chosen-panel">
      <div class="panel-title">
        <span class="panel-icon">🥣</span>
        Your Bowl ({{ chosenToppings().length }})
      </div>
      @if (chosenToppings().length === 0) {
        <div class="empty-bowl">
          <span>🍽️</span>
          <p>Your bowl is empty — add some toppings!</p>
        </div>
      } @else {
        <app-toppings
          [toppings]="chosenToppings()"
          buttonLabel="Remove"
          [compact]="true"
          (chooseTopping)="RemoveTopping($event)"
        ></app-toppings>
      }
    </section>
  </div>
</div>
